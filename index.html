    <meta name="theme-color" content="#091217" />
    <script>
      (() => {
        let preference;
        try { preference = localStorage.getItem('lansutech-theme'); } catch { /* System preference remains available without storage. */ }
        const dark = preference === 'dark' || (preference !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        document.querySelector('meta[name="theme-color"]').content = dark ? '#091217' : '#eaf3f3';
      })();
    </script>
